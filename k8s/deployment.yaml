apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-app
  namespace: cloud-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-app

  template:
    metadata:
      labels:
        app: cloud-app

    spec:
      containers:
        - name: cloud-app
          image: cloud-native-app:1.0

          ports:
            - containerPort: 5000

          env:
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: cloudapp

            - name: DB_USER
              value: devuser

            - name: DB_PASSWORD
              value: devpass

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"