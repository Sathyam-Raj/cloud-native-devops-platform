apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: cloud-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:17

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: cloudapp

            - name: POSTGRES_USER
              value: devuser

            - name: POSTGRES_PASSWORD
              value: devpass

          volumeMounts:
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init