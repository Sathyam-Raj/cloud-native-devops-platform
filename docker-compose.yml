services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cloud-app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloudapp
      DB_USER: devuser
      DB_PASSWORD: devpass
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: cloud-postgres-compose
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: cloudapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d cloudapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: