name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  ci:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::534670738035:role/GitHubActionsECRPushRole
          aws-region: eu-north-1

      - name: Verify AWS identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run lint
        run: ruff check src tests

      - name: Run tests
        run: pytest

      - name: Build Docker image
        working-directory: .
        run: docker build -f docker/Dockerfile -t cloud-native-app:${{ github.sha }} .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-native-app:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: 534670738035.dkr.ecr.eu-north-1.amazonaws.com
          ECR_REPOSITORY: cloud-native-devops-platform
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag cloud-native-app:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Helm image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("helm/cloud-app/values.yaml")
          text = path.read_text()

          new_text, count = re.subn(
              r'(?m)^(\s*tag:\s*")[^"]+(")\s*$',
              rf'\g<1>{os.environ["IMAGE_TAG"]}\2',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit("Could not find image.tag in helm/cloud-app/values.yaml")

          path.write_text(new_text)
          PY

      - name: Commit updated Helm image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/cloud-app/values.yaml
          git diff --cached --quiet || git commit -m "Update Helm image tag to ${{ github.sha }} [skip ci]"
          git push
